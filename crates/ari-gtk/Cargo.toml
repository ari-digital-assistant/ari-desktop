[package]
name = "ari-gtk"
description = "Ari for Linux: the GTK4/libadwaita app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Minimum supported platform: GTK 4.22 and libadwaita 1.9, which is GNOME 50
# and Ubuntu 26.04 LTS. The version features make building the test of that:
# an API from a later release doesn't compile.
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
# The Background portal, for starting at login inside Flatpak.
ashpd = { version = "0.14", default-features = false, features = ["tokio", "background"] }
# ashpd's D-Bus connection runs on Tokio; see `main`. Its channel carries the
# engine's callbacks to the main loop.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# The system's gettext (glibc's), not a bundled copy.
gettext-rs = { version = "0.8", features = ["gettext-system"] }
clap = { version = "4", features = ["derive"] }
# The engine, at the revision this app is tested with. For local work against
# a checkout, patch it in an untracked .cargo/config.toml:
#   [patch."https://github.com/ari-digital-assistant/ari-engine"]
#   ari-core = { path = "../ari-engine/crates/ari-core" }
#   ari-engine = { path = "../ari-engine/crates/ari-engine" }
#   ari-runtime = { path = "../ari-engine/crates/ari-runtime" }
#   ari-skill-loader = { path = "../ari-engine/crates/ari-skill-loader" }
#   ari-voice = { path = "../ari-engine/crates/ari-voice" }
# Without `llm`: the on-device assistant comes with stage 9 of dev.md.
# What a skill's envelope asks for, and what pressing a card's button does.
ari-core = { git = "https://github.com/ari-digital-assistant/ari-engine", rev = "6f6401dfc37c8b13447ee84dfc054bfb49659a51" }
ari-engine = { git = "https://github.com/ari-digital-assistant/ari-engine", rev = "6f6401dfc37c8b13447ee84dfc054bfb49659a51", default-features = false }
ari-runtime = { git = "https://github.com/ari-digital-assistant/ari-engine", rev = "6f6401dfc37c8b13447ee84dfc054bfb49659a51", default-features = false }
ari-skill-loader = { git = "https://github.com/ari-digital-assistant/ari-engine", rev = "6f6401dfc37c8b13447ee84dfc054bfb49659a51" }
ari-voice = { git = "https://github.com/ari-digital-assistant/ari-engine", rev = "6f6401dfc37c8b13447ee84dfc054bfb49659a51" }
# The conversation log and remembered facts on disk.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# API keys and other secret skill settings: the Secret portal inside Flatpak,
# the Secret Service outside it.
oo7 = { version = "0.7.3", default-features = false, features = ["tokio", "native_crypto"] }
# Assistants answer in markdown.
pulldown-cmark = { version = "0.13.6", default-features = false }
# Alert sounds. GTK's own media playback is built on GStreamer, but drawing
# through it from a sound with no window broke the window's drawing; this
# plays audio only.
gstreamer = "0.25.4"

[build-dependencies]
# Builds the icons Ari ships into the binary.
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"
